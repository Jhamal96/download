  new MutationObserver(()=>{const light=currentIsLight();if(root.classList.contains('ajd-glass-light')!==light)root.classList.toggle('ajd-glass-light',light)}).observe(root,{attributes:true,attributeFilter:['class','data-theme','data-appearance']});
})();
</script>
